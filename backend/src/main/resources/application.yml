# ============================================================================
# AMOMS 应用配置
# Spring Boot 3.2.x | 参考：ARCHITECTURE.md + DATABASE.md + schema.sql
# Profile：dev（默认）/ prod
# ============================================================================

spring:
  application:
    name: amoms
  profiles:
    active: dev

  # ---------- MySQL ----------
  # utf8mb4 显式指定防止中文乱码
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "jdbc:mysql://localhost:3306/amoms?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false"
    username: root
    # ${环境变量:本地默认值}：部署时读取系统环境变量，本地未设置时使用冒号后的默认值，启动不报错。
    password: "${DB_PASSWORD:130026}"
    hikari:
      pool-name: AmomsHikariPool
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: "SELECT 1"

  # 注：Redis 依赖虽在 pom 中，但项目未使用任何缓存注解/RedisTemplate，
  # 且 AmomsApplication 已排除 RedisAutoConfiguration，故此处不再保留无效 Redis 配置。

  # ---------- Jackson 序列化 ----------
  jackson:
    date-format: "yyyy-MM-dd HH:mm:ss"
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false

  # ---------- 文件上传 ----------
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB

# ---------- MyBatis-Plus ----------
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    lazy-loading-enabled: false
    default-statement-timeout: 30
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      table-underline: true
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto
  # 注：全部 Mapper 均继承 BaseMapper，resources 下无 XML 文件，故移除无效 mapper-locations。
  type-aliases-package: com.peak.entity

# ---------- JWT ----------
amoms:
  jwt:
    # ${环境变量:本地默认值}：部署时读取系统环境变量，本地未设置时使用冒号后的默认值，启动不报错。
    # 注意：JwtUtil 构造时会对该值做 Base64 解码，且 HS256 要求密钥 ≥32 字节，
    #       所以默认值必须写成 Base64 串；直接写明文（如 testJwtSecret20261105）会启动失败。
    #       默认值对应明文：amoms-peak-course-jwt-secret-key-20261105（41 字节）
    secret: "${JWT_SECRET:YW1vbXMtcGVhay1jb3Vyc2Utand0LXNlY3JldC1rZXktMjAyNjExMDU=}"
    expire-seconds: 7200
    issuer: AMOMS
    header: Authorization
    prefix: "Bearer "
    blacklist-prefix: "auth:blacklist:"
  bcrypt-strength: 10

# ---------- Actuator ----------
management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus"
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
  metrics:
    tags:
      application: "${spring.application.name}"

# ---------- Swagger ----------
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

knife4j:
  enable: true
  setting:
    language: zh_cn

# ---------- Server ----------
server:
  port: 8080
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      force: true
      force-request: true
      force-response: true

# ---------- Logback ----------
logging:
  level:
    root: INFO
    com.peak: DEBUG
    com.baomidou.mybatisplus: INFO
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [%X{traceId}] - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [%X{traceId}] - %msg%n"
  file:
    name: logs/app.log
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30
      total-size-cap: 10GB
      file-name-pattern: "logs/app.%d{yyyy-MM-dd}.%i.log.gz"

# ================================================================
# dev Profile 覆盖
# ================================================================
---
spring:
  config:
    activate:
      on-profile: dev

mybatis-plus:
  configuration:
    # dev 环境打印 SQL 便于联调/答辩演示。
    # 脱敏说明：登录链路只把 username 作为 SQL 参数，密码仅参与 BCrypt 内存比对，
    # 不会出现在 SQL 日志中；改密接口本次不开发，故日志里不会出现 password_hash 明文参数。
    # 如需彻底静默，可改为 org.apache.ibatis.logging.nologging.NoLoggingImpl。
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.peak: DEBUG
    com.baomidou.mybatisplus.core: DEBUG

knife4j:
  enable: true
  production: false

# ================================================================
# prod Profile 覆盖
# ================================================================
---
spring:
  config:
    activate:
      on-profile: prod

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

logging:
  level:
    root: INFO
    com.peak: INFO

knife4j:
  enable: false
  production: true
